<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Sulín Trails — offline trail navigation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<!-- minimal top chrome: status pill + gear -->
<div id="topbar" style="display:contents">
  <div id="status">
    <span class="l1" id="stL1">Sulín Trails</span>
    <span class="l2" id="stL2">Open controls to choose a trail</span>
  </div>
  <button id="gearBtn" aria-pressed="false" aria-label="Controls" title="Controls">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V15z"/>
    </svg>
  </button>
</div>

<!-- quick-access map buttons (pulled out of the menu) -->
<div id="quickbar">
  <button id="orientBtn" aria-pressed="false" aria-label="Heading-up map" title="Heading-up map">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 19 21 12 17 5 21 12 2" fill="currentColor" stroke="none"/></svg>
  </button>
  <button id="compassBtn" aria-pressed="false" aria-label="Compass" title="Compass">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><polygon points="15.6 8.4 13.6 13.6 8.4 15.6 10.4 10.4 15.6 8.4" fill="currentColor" stroke="none"/></svg>
  </button>
  <button id="radarBtn" aria-pressed="false" aria-label="Rain radar" title="Rain radar">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5a4 4 0 0 1-.5-7.97 5 5 0 0 1 9.6-1.2A3.5 3.5 0 0 1 18 15.5"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></svg>
  </button>
  <button id="poiBtn" aria-pressed="false" aria-label="Water · huts · views" title="Water · huts · views">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
  </button>
</div>

<!-- weather chip -->
<button id="wxChip" hidden aria-label="Weather">
  <span id="wxIcon"></span><span id="wxTemp">—</span>
</button>

<!-- control panel -->
<div id="panel" hidden>
  <button class="row primary" id="gpsBtn">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg></span>
    <span class="lbl">Start GPS</span></button>

  <div class="sep"></div>

  <div class="routebox">
    <div class="rrow"><span class="rlbl">Start</span>
      <button type="button" class="pk-trigger" id="startBtn" aria-haspopup="listbox" aria-label="Start point"></button>
      <select id="startSel" aria-label="Start point" hidden></select></div>
    <div class="rrow"><span class="rlbl">End</span>
      <button type="button" class="pk-trigger" id="endBtn" aria-haspopup="listbox" aria-label="End point"></button>
      <select id="endSel" aria-label="End point" hidden></select></div>
    <div id="routeList" class="routelist" hidden></div>
  </div>

  <div class="sep"></div>

  <button class="row" id="recBtn" aria-pressed="false" disabled>
    <span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#ef4444"/></svg></span>
    <span class="lbl">Record ride</span><span class="state"></span></button>

  <button class="row" id="voiceBtn" aria-pressed="false">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></span>
    <span class="lbl">Voice off-track alerts</span><span class="state"></span></button>

  <button class="row" id="testBtn">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg></span>
    <span class="lbl">Test the alert</span></button>

  <button class="row" id="pocketBtn">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
    <span class="lbl">Pocket mode</span></button>

  <button class="row" id="routeGpxBtn">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></span>
    <span class="lbl">Route GPX (for watch apps)</span></button>

  <button class="row" id="elevToggle" aria-pressed="false">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M4 19l5-8 3.5 4.5L16 9l4 10"/></svg></span>
    <span class="lbl">Elevation profile</span><span class="state"></span></button>

  <div class="sep"></div>

  <div class="row selrow">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 3 8 12 13 21 8 12 3"/><polyline points="3 13 12 18 21 13"/></svg></span>
    <span class="lbl">Base map</span>
    <button type="button" class="pk-trigger" id="baseBtn" aria-haspopup="listbox" aria-label="Base map"></button>
    <select id="baseSel" hidden>
      <option value="esri">Satellite</option>
      <option value="otm">Topographic</option>
      <option value="freemap">Outdoor</option>
      <option value="osm">Streets</option>
    </select>
  </div>
</div>

<!-- option picker (opaque modal, replaces native <select> popups) -->
<div id="pickOverlay" hidden>
  <div id="pickModal" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <div class="pk-h">
      <b id="pickTitle">Select</b>
      <button class="x" id="pickClose" aria-label="Close">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="pickList" class="pk-list" role="listbox"></div>
  </div>
</div>

<!-- compass rose: dial shows true directions, fixed arrow = your facing, green arrow = to the trail -->
<div id="compass" hidden aria-live="polite">
  <svg viewBox="0 0 120 120" id="rose">
    <circle cx="60" cy="60" r="54" class="ring"/>
    <g id="roseDial" style="transform-origin:60px 60px">
      <text x="60" y="21" class="card n">N</text><text x="101" y="62" class="card">E</text>
      <text x="60" y="105" class="card">S</text><text x="19" y="62" class="card">W</text>
      <line x1="60" y1="6" x2="60" y2="14" class="tick n"/><line x1="114" y1="60" x2="106" y2="60" class="tick"/>
      <line x1="60" y1="114" x2="60" y2="106" class="tick"/><line x1="6" y1="60" x2="14" y2="60" class="tick"/>
      <g class="minor">
        <line x1="87" y1="13.2" x2="84" y2="18.4" class="tick m"/><line x1="106.8" y1="33" x2="101.6" y2="36" class="tick m"/>
        <line x1="106.8" y1="87" x2="101.6" y2="84" class="tick m"/><line x1="87" y1="106.8" x2="84" y2="101.6" class="tick m"/>
        <line x1="33" y1="106.8" x2="36" y2="101.6" class="tick m"/><line x1="13.2" y1="87" x2="18.4" y2="84" class="tick m"/>
        <line x1="13.2" y1="33" x2="18.4" y2="36" class="tick m"/><line x1="33" y1="13.2" x2="36" y2="18.4" class="tick m"/>
      </g>
    </g>
    <g id="trailArrow" style="transform-origin:60px 60px" opacity="0">
      <polygon points="60,18 52,38 60,32 68,38" class="ta"/>
    </g>
    <g id="needle" style="transform-origin:60px 60px">
      <polygon points="60,34 54,62 66,62" class="needle-n"/><polygon points="60,86 54,62 66,62" class="needle-s"/>
    </g>
    <circle cx="60" cy="60" r="4" class="hub"/>
  </svg>
  <div id="compassRead">—</div>
  <div id="compassTrail" hidden></div>
</div>

<!-- weather detail -->
<div id="wxPanel" hidden>
  <div class="wxh">
    <b id="wxTitle">Weather</b><span class="meta" id="wxAsOf"></span>
    <button class="x" id="wxExpand" aria-label="More detail" aria-pressed="false" title="Full forecast">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="x" id="wxClose" aria-label="Close">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="wxNow"></div>
  <div id="wxMore" hidden></div>
  <div id="wxSun"></div>
  <div id="wxHourly"></div>
  <div id="wxDaily"></div>
</div>

<!-- elevation profile -->
<div id="elevPanel" hidden>
  <div class="eh">
    <b id="elevTitle">Elevation</b>
    <span class="meta" id="elevMeta"></span>
    <button class="x" id="elevClose" aria-label="Close">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="elevRead">Drag along the profile</div>
  <svg id="elevSvg" viewBox="0 0 640 110" preserveAspectRatio="none" aria-label="Trail elevation profile"></svg>
  <div id="elevLegend" aria-hidden="true"></div>
</div>

<!-- pocket mode: black touch-guard overlay, dim glanceable status -->
<div id="pocketOverlay" hidden>
  <div id="pocketClock">--:--</div>
  <div id="pocketStatus">—</div>
  <div id="pocketHint">Hold 2 s to exit</div>
</div>

<div id="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-rotate.js"></script>
<script src="app.js"></script>
</body>
</html>
